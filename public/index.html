<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="MetricLore — ontology-grounded data agent and LLM Wiki workbench">
  <title>MetricLore · 数据智能体</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#workspace">跳到主内容</a>
  <header class="mobile-bar">
    <button id="open-nav" class="icon-button" type="button" aria-label="打开导航">☰</button>
    <a class="mobile-brand" href="#/ask">MetricLore</a>
    <button id="open-context" class="icon-button" type="button" aria-label="打开上下文面板">◫</button>
  </header>
  <div id="app-shell">
    <aside id="nav-rail" aria-label="主导航">
      <a class="brand" href="#/ask" aria-label="MetricLore 首页">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        <span><strong>MetricLore</strong><small>数据智能体</small></span>
      </a>
      <button id="new-chat" class="new-chat" type="button"><span>＋</span> 新建分析</button>
      <nav id="primary-nav">
        <section><small>工作区</small><a href="#/ask" data-route="/ask"><b>⌁</b><span>问答</span></a></section>
        <section>
          <small>知识</small>
          <a href="#/knowledge/builder" data-route="/knowledge/builder"><b>⇧</b><span>知识构建</span></a>
          <a href="#/knowledge/review" data-route="/knowledge/review"><b>✓</b><span>审核队列</span><em id="review-count" hidden>0</em></a>
          <a href="#/knowledge/wiki" data-route="/knowledge/wiki"><b>▤</b><span>知识库</span></a>
          <a href="#/knowledge/ontology" data-route="/knowledge/ontology"><b>◎</b><span>本体图谱</span></a>
        </section>
        <section>
          <small>数据与质量</small>
          <a href="#/data/metrics" data-route="/data/metrics"><b>∑</b><span>指标</span></a>
          <a href="#/data/semantic" data-route="/data/semantic"><b>⌘</b><span>语义模型</span></a>
          <a href="#/evaluate" data-route="/evaluate"><b>◇</b><span>评测</span></a>
        </section>
      </nav>
      <section class="recent-block">
        <div class="rail-heading"><small>最近对话</small><button id="refresh-chats" type="button" aria-label="刷新会话">↻</button></div>
        <div id="recent-chats" class="recent-chats"><span class="rail-muted">正在读取…</span></div>
      </section>
      <div class="rail-footer">
        <a href="#/settings" data-route="/settings"><b>⚙</b><span>设置</span></a>
        <div class="service-state"><i></i><span id="health-label">本地服务</span></div>
      </div>
    </aside>
    <div id="stage">
      <main id="workspace" tabindex="-1" aria-live="polite"><div class="route-loading"><span></span><p>正在打开工作台…</p></div></main>
      <aside id="context-panel" aria-label="上下文面板">
        <header class="context-header">
          <div><small id="context-eyebrow">上下文</small><h2 id="context-title">工作区</h2></div>
          <button id="close-context" class="icon-button" type="button" aria-label="关闭上下文面板">×</button>
        </header>
        <div id="context-body" class="context-body">
          <div class="context-empty"><span>⌁</span><h3>上下文会出现在这里</h3><p>选择一条执行轨迹、证据、实体或文件，查看它与当前任务的关系。</p></div>
        </div>
      </aside>
    </div>
  </div>
  <button id="screen-overlay" type="button" aria-label="关闭面板"></button>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
