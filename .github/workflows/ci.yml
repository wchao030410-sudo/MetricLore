name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run health
      - run: npm run eval
      - run: npm run eval:multi-turn
      - run: npm run eval:wiki
      - run: npm run audit
      - run: npm audit --omit=dev
